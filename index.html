<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gorilla Tag</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1a1a2e;
      color: #e0e0e0;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #4ecca3;
    }

    p {
      font-size: 1.25rem;
      color: #a0a0b0;
    }

    .section {
      margin-top: 2.5rem;
      background: #16213e;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    }

    .section h2 {
      font-size: 1.5rem;
      color: #4ecca3;
      margin-bottom: 1.25rem;
    }

    .tracker-stats {
      background-color: #eef2f7;
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
      margin-top: 20px;
      text-align: left;
    }

    .tracker-stats p {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .tracker-stats span {
      font-weight: bold;
    }


  </style>
</head>
<body>
  <div class="container">
    <h1>Gorilla Tag</h1>
    <p>Welcome to Gorilla Tag</p>

    <section id="tracker" class="section">
      <h2>Gorilla Tag Token Tracker</h2>
      <div class="tracker-stats">
        <p><strong>Current Price:</strong> <span id="price">Loading...</span></p>
        <p><strong>Market Cap:</strong> <span id="market-cap">Loading...</span></p>
        <p><strong>Total Supply:</strong> <span id="total-supply">100,000,000</span></p>
      </div>
    </section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Simulate fetching data for Token Tracker
      setTimeout(function () {
        // Example static data, you can replace with real API calls later
        document.getElementById('price').innerText = '$0.01';
        document.getElementById('market-cap').innerText = '$1,000,000';
      }, 1000);
    });
  </script>
</body>
</html>
